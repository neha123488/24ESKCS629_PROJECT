<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About MedServe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="frontend_style.css" />
    <style>
      .about-page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 24px 72px;
      }
      .about-hero {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 28px;
        background: linear-gradient(135deg, #edf8f7 0%, #f8faf9 100%);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 40px;
        margin-bottom: 34px;
        align-items: center;
      }
      .about-hero h1 {
        margin: 0 0 12px;
        font-family: var(--serif);
        font-size: clamp(2.3rem, 4vw, 4rem);
        letter-spacing: -0.04em;
      }
      .about-hero p {
        margin: 0;
        max-width: 700px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .hero-visual {
        min-height: 260px;
        border-radius: 18px;
        background:
          linear-gradient(rgba(14, 55, 52, 0.25), rgba(14, 55, 52, 0.18)),
          url('https://images.unsplash.com/photo-1538108149393-fbbd81895907?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      }
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }
      .primary-btn, .secondary-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 600;
        transition: transform 0.15s ease;
      }
      .primary-btn {
        background: var(--teal);
        color: #fff;
      }
      .secondary-btn {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .primary-btn:hover, .secondary-btn:hover { transform: translateY(-1px); }
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 22px;
        margin-bottom: 34px;
      }
      .info-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px 22px;
      }
      .info-card h3 {
        margin: 0 0 12px;
        font-family: var(--serif);
        font-size: 1.6rem;
      }
      .info-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      .doctor-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin: 22px 0 34px;
      }
      .doctor-card {
        background: linear-gradient(180deg, #ffffff 0%, #f7fbfb 100%);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }
      .doctor-photo {
        height: 180px;
        background-size: cover;
        background-position: center;
      }
      .doctor-card__body {
        padding: 18px 16px 20px;
      }
      .doctor-card__body h4 {
        margin: 0 0 6px;
        font-size: 1.1rem;
      }
      .doctor-card__role {
        color: var(--teal);
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .doctor-card__body p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--muted);
      }
      .testimonial {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px 26px;
        margin-top: 16px;
      }
      .testimonial p {
        margin: 0;
        font-size: 1.03rem;
        line-height: 1.8;
        color: var(--muted);
      }
      .testimonial strong {
        display: block;
        margin-top: 14px;
        color: var(--ink);
      }
      .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 18px;
        margin-top: 14px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px 18px;
      }
      .stat strong {
        display: block;
        font-family: var(--serif);
        font-size: 2.2rem;
        margin-bottom: 6px;
        color: var(--teal);
      }
      .stat span {
        color: var(--muted);
      }
      @media (max-width: 760px) {
        .about-hero { grid-template-columns: 1fr; padding: 28px 20px; }
      }
    </style>
  </head>
  <body>
    <div id="root" data-page="about"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="site_pages.js"></script>
  </body>
</html>
