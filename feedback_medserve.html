<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedServe Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="frontend_style.css" />
    <style>
      .page-shell { max-width: 1100px; margin: 0 auto; padding: 48px 24px 72px; }
      .page-hero { text-align:center; margin-bottom: 28px; }
      .page-hero h1 { font-family: var(--serif); font-size: clamp(2.2rem, 4vw, 3.5rem); margin:0 0 10px; }
      .page-hero p { color: var(--muted); max-width: 700px; margin:0 auto; line-height: 1.7; }
      .review-summary { display:grid; grid-template-columns: 220px 1fr; gap:22px; margin: 30px 0; }
      .rating-box, .review-card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px 20px; }
      .rating-box .stars { font-size: 1.8rem; letter-spacing: 0.08em; color: #f4b740; margin: 8px 0; }
      .rating-box strong { display:block; font-family: var(--serif); font-size: 3rem; color: var(--teal); }
      .rating-box span { color: var(--muted); }
      .review-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:18px; }
      .review-card h3 { margin:0 0 10px; font-family: var(--serif); font-size:1.5rem; }
      .review-card p { margin:0; color: var(--muted); line-height:1.7; }
      .review-card .person { margin-top: 14px; font-weight: 700; color: var(--ink); }
      .feedback-form { margin-top: 32px; background:linear-gradient(135deg, #edf8f7, #f8faf9); border:1px solid var(--line); border-radius:20px; padding:28px 24px; }
      .feedback-form h2 { margin:0 0 18px; font-family: var(--serif); font-size:2rem; }
      .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
      .field { display:flex; flex-direction:column; gap:8px; }
      .field label { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
      .field input, .field textarea { border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
      .field textarea { min-height:120px; resize:vertical; }
      .rating-row { margin-top: 12px; display:flex; align-items:center; gap:10px; flex-wrap: wrap; }
      .rating-row span { color: var(--muted); }
      .star-rating { display:flex; gap:6px; font-size: 1.8rem; line-height: 1; }
      .star { background:none; border:none; cursor:pointer; color:#d1d5db; padding:0; transition: transform 0.15s ease, color 0.15s ease; }
      .star:hover, .star.active { color:#f4b740; transform: scale(1.08); }
      .selected-rating { font-weight:600; color: var(--teal); }
      @media (max-width: 760px) { .review-summary, .form-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root" data-page="feedback"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="site_pages.js"></script>
  </body>
</html>
