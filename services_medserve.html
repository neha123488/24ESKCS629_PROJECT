<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedServe Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="frontend_style.css" />
    <style>
      .page-shell { max-width: 1100px; margin: 0 auto; padding: 48px 24px 72px; }
      .page-hero { text-align: center; margin-bottom: 26px; }
      .page-hero h1 { font-family: var(--serif); font-size: clamp(2.2rem, 4vw, 3.5rem); margin: 0 0 10px; }
      .page-hero p { color: var(--muted); max-width: 700px; margin: 0 auto; line-height: 1.7; }
      .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 30px; }
      .service-box { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px 20px; }
      .service-box .icon { width:42px; height:42px; border-radius:12px; background: rgba(42,111,111,0.1); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--teal); margin-bottom: 14px; }
      .service-box h3 { margin:0 0 10px; font-family: var(--serif); font-size:1.55rem; }
      .service-box p { margin:0; color:var(--muted); line-height:1.7; }
      .cta-box { margin-top: 32px; background: linear-gradient(135deg, #edf8f7, #f8faf9); border:1px solid var(--line); border-radius:18px; padding:28px 24px; text-align:center; }
      .cta-box h3 { margin:0 0 8px; font-family: var(--serif); font-size:1.8rem; }
      .cta-box p { margin:0 0 18px; color:var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-page="services"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="site_pages.js"></script>
  </body>
</html>
