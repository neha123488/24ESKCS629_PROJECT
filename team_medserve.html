<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedServe Doctors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="frontend_style.css" />
    <style>
      .page-shell { max-width: 1100px; margin: 0 auto; padding: 48px 24px 72px; }
      .page-hero { text-align:center; margin-bottom: 28px; }
      .page-hero h1 { font-family: var(--serif); font-size: clamp(2.3rem, 4vw, 3.6rem); margin:0 0 10px; }
      .page-hero p { color: var(--muted); max-width:700px; margin:0 auto; line-height:1.7; }
      .doctor-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:22px; margin-top: 30px; }
      .doctor-card { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
      .doctor-photo { height:220px; background-size:cover; background-position:center; }
      .doctor-info { padding:20px 18px 22px; }
      .doctor-info h3 { margin:0 0 5px; font-family: var(--serif); font-size:1.7rem; }
      .role { color: var(--teal); font-size:0.9rem; font-weight:700; text-transform: uppercase; letter-spacing: 0.04em; }
      .doctor-info p { margin: 12px 0 0; color:var(--muted); line-height:1.7; }
    </style>
  </head>
  <body>
    <div id="root" data-page="team"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="site_pages.js"></script>
  </body>
</html>
